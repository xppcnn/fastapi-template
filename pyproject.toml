[project]
name = "fastapi-template"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.0",
    "asyncpg>=0.31.0",
    "email-validator>=2.2",
    "fastapi[standard]>=0.141.1",
    "pwdlib[argon2]>=0.3",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.10",
    "sqlalchemy[asyncio]>=2.0",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.21",
    "httpx>=0.28.1",
    "mypy>=1.17",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.1",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
pythonpath = ["."]
