services:
  silo:
    image: pgsty/silo:RELEASE.2026-08-06T00-00-00Z
    container_name: fastapi-template-silo
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: silo-admin
      MINIO_ROOT_PASSWORD: silo-admin
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:8000,http://127.0.0.1:8000"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - silo_data:/data
    healthcheck:
      test: ["CMD", "silo", "healthcheck", "ready"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16
    container_name: fastapi-template-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fastapi_template
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fastapi_template"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  silo_data:
